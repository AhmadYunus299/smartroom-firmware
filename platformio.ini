; Build dengan PlatformIO:  pio run   |  upload: pio run -t upload  |  monitor: pio device monitor
; Sumber kode yang sama dipakai Arduino IDE (firmware/smartroom/smartroom.ino).
[platformio]
src_dir = firmware/smartroom
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/DHT sensor library@^1.4.7
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.13
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.3
